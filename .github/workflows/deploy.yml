name: wiedeck.de manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'public/**'

permissions:
  contents: read

concurrency:
  group: wiedeck-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Landingpage per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dateien abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Freigestellte MW-Symbole erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mw-venv"
          "$RUNNER_TEMP/mw-venv/bin/pip" install --disable-pip-version-check --quiet Pillow
          "$RUNNER_TEMP/mw-venv/bin/python" scripts/build_mw_transparent.py

      - name: Prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -s branding/mw-monogram-original.png
          test -f scripts/build_mw_transparent.py
          test -s public/logos/mw-symbol-light.png
          test -s public/logos/mw-symbol-dark.png
          test -s public/logos/mw-favicon-light.png
          test -s public/logos/mw-favicon-dark.png
          grep -q 'id="mw-cutout-light"' public/index.html
          grep -q 'id="mw-cutout-dark"' public/index.html
          ! grep -q 'hero-logo-card' public/index.html
          grep -q 'aspect-ratio:745 / 366' public/index.html
          grep -Fq '.hero-mark img.logo-mode-dark{width:100%;filter:url("#mw-cutout-dark");clip-path:inset(10px 0 6px 0)}' public/index.html
          grep -Fq '.hero-mark img.logo-mode-dark{width:100%;filter:url("#mw-cutout-dark");clip-path:inset(10px 0 6px 0)}' public/en/index.html
          test -f public/favicon.svg
          test -f public/impressum.html
          test -f public/datenschutz.html
          test -f public/en/index.html
          test -f public/en/impressum.html
          test -f public/en/datenschutz.html
          test -s public/assets/home-projects.css
          test -s public/logos/tennilo-score-transparent.png
          grep -Fq 'Theme continuity / MW 2026' public/assets/home-projects.css
          grep -Fq 'var(--mw-social-bg)' public/assets/home-projects.css
          grep -Fq 'var(--mw-feature-bg)' public/assets/home-projects.css
          grep -Fq 'var(--mw-minis-feature-bg)' public/assets/home-projects.css
          grep -Fq 'Theme continuity: legal footer' public/legal.css
          test -s public/logos/mw-watermark-original.png
          grep -Fq 'logos/mw-watermark-original.png' public/index.html
          grep -Fq 'logos/mw-watermark-original.png' public/en/index.html
          grep -Fq 'html[data-theme="dark"] .social-watermark' public/assets/home-projects.css
          ! grep -Fq 'social-watermark logo-mode-light' public/index.html
          ! grep -Fq 'social-watermark logo-mode-dark' public/index.html
          grep -Fq 'width:min(22vw,255px)' public/assets/home-projects.css
          grep -Fq 'data-scroll-top' public/index.html
          grep -Fq 'data-scroll-top' public/en/index.html
          grep -Fq 'scrollToPageStart(false)' public/theme.js
          test -s public/media/score-demo-watch.png
          test -s public/media/score-demo-watch-cutout.svg
          test -s public/media/michael-wiedeck-persoenlich.jpg
          grep -q 'id="micha"' public/index.html
          grep -q 'id="micha"' public/en/index.html
          test "$(grep -o 'class="life-card life-card--' public/index.html | wc -l)" -eq 6
          test "$(grep -o 'class="life-card life-card--' public/en/index.html | wc -l)" -eq 6
          grep -q 'REISEN' public/index.html
          grep -q 'TRAVEL' public/en/index.html
          grep -q 'FAMILIE' public/index.html
          grep -q 'FAMILY' public/en/index.html
          grep -q 'id="unterwegs"' public/index.html
          grep -q 'id="unterwegs"' public/en/index.html
          test "$(grep -o 'class="travel-card' public/index.html | wc -l)" -eq 26
          test "$(grep -o 'class="travel-card' public/en/index.html | wc -l)" -eq 26
          test "$(grep -o 'travel-card--repeat' public/index.html | wc -l)" -eq 5
          test "$(grep -o 'travel-card--repeat' public/en/index.html | wc -l)" -eq 5
          grep -q 'Schottland' public/index.html
          grep -q 'Scotland' public/en/index.html
          grep -Fq 'travel-grid' public/assets/home-projects.css
          ! grep -q 'id="story-title"' public/index.html
          grep -Fq 'personal-grid' public/assets/home-projects.css
          grep -Fq 'html[data-theme="dark"]{' public/assets/home-projects.css
          grep -q 'watch-silhouette' public/media/score-demo-watch-cutout.svg
          test -s public/media/score-demo-phone.png
          test -s public/media/score-demo-scoreboard.png
          grep -q 'id="aktuell"' public/index.html
          grep -q 'id="now"' public/en/index.html
          grep -q 'id="einblicke"' public/index.html
          grep -q 'id="glimpses"' public/en/index.html
          ! grep -Fq 'score.tennilo.de' public/index.html
          ! grep -Fq 'score.tennilo.de' public/en/index.html
          grep -q 'class="manifesto-logo-light logo-mode-light"' public/index.html
          grep -q 'class="manifesto-logo-dark logo-mode-dark"' public/index.html
          grep -q 'class="manifesto-logo-light logo-mode-light"' public/en/index.html
          grep -q 'class="manifesto-logo-dark logo-mode-dark"' public/en/index.html
          grep -Fq 'html[data-theme="dark"] .manifesto' public/assets/home-projects.css
          grep -q 'class="manifesto-logo-viewport"' public/index.html
          grep -q 'class="manifesto-logo-viewport"' public/en/index.html
          test -s public/logos/tennilo-tournament-transparent.png
          test -s public/logos/mini-apps/wm04b-logo.svg
          test -s public/logos/mini-apps/pl05-icon.webp
          test -s public/logos/mini-apps/fc05-icon.webp
          test -s public/logos/mini-apps/nk05-icon.webp
          test -s public/logos/mini-apps/ne05-icon.webp
          test -s public/logos/mini-apps/vd05-icon.webp
          grep -q 'id="mini-apps"' public/index.html
          grep -q 'id="mini-apps"' public/en/index.html
          ! grep -Fq 'score.tennilo.de' public/index.html
          ! grep -Fq 'score.tennilo.de' public/en/index.html
          test -f public/legal.css
          test -f public/theme.js
          test -f public/logos/tennis-schiri.png
          test -f public/logos/tennis-schiri-on-light.png
          test -f public/logos/tennilo.png
          test -s public/logos/tennilo-tournament.png
          test -f public/logos/tennilo-score.png
          test -f public/logos/tennilo-score-dark-original.png
          test -s public/logos/tennilo-umpire.png
          test -f public/logos/wer-muss.webp
          test -s public/logos/mw-hauptlogo-hell.png
          test -s public/logos/mw-hauptlogo-dunkel.png
          test -s public/logos/mw-icon-hell.png
          test -s public/logos/mw-icon-dunkel.png

      - name: Nur Website-Dateien hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt}"
          : "${FTP_USER:?FTP_USER fehlt}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt}"
          # WICHTIG: FTP-Benutzer muss als Startverzeichnis /wiedeck-de/ haben.
          # Dadurch landen index.html und favicon.svg direkt im Domain-Verzeichnis.
          for file in public/favicon.svg public/theme.js public/legal.css public/impressum.html public/datenschutz.html public/en/index.html public/en/impressum.html public/en/datenschutz.html public/logos/tennis-schiri.png public/logos/tennis-schiri-on-light.png public/logos/tennilo.png public/logos/tennilo-tournament.png public/logos/tennilo-tournament-transparent.png public/assets/home-projects.css public/media/score-demo-watch.png public/media/score-demo-watch-cutout.svg public/media/michael-wiedeck-persoenlich.jpg public/media/score-demo-phone.png public/media/score-demo-scoreboard.png public/logos/tennilo-score.png public/logos/tennilo-score-transparent.png public/logos/tennilo-score-dark-original.png public/logos/tennilo-umpire.png public/logos/wer-muss.webp public/logos/mini-apps/wm04b-logo.svg public/logos/mini-apps/pl05-icon.webp public/logos/mini-apps/fc05-icon.webp public/logos/mini-apps/nk05-icon.webp public/logos/mini-apps/ne05-icon.webp public/logos/mini-apps/vd05-icon.webp public/logos/mw-hauptlogo-hell.png public/logos/mw-hauptlogo-dunkel.png public/logos/mw-icon-hell.png public/logos/mw-icon-dunkel.png public/logos/mw-symbol-light.png public/logos/mw-symbol-dark.png public/logos/mw-watermark-original.png public/logos/mw-favicon-light.png public/logos/mw-favicon-dark.png public/index.html; do
            remote="${file#public/}"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
          done
