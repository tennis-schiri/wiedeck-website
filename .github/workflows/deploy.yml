name: wiedeck.de manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: wiedeck-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Landingpage per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dateien abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Freigestellte MW-Symbole erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mw-venv"
          "$RUNNER_TEMP/mw-venv/bin/pip" install --disable-pip-version-check --quiet Pillow
          "$RUNNER_TEMP/mw-venv/bin/python" scripts/build_mw_transparent.py

      - name: Prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -s branding/mw-monogram-original.png
          test -f scripts/build_mw_transparent.py
          test -s public/logos/mw-symbol-light.png
          test -s public/logos/mw-symbol-dark.png
          test -s public/logos/mw-favicon-light.png
          test -s public/logos/mw-favicon-dark.png
          grep -q 'id="mw-cutout-light"' public/index.html
          grep -q 'id="mw-cutout-dark"' public/index.html
          ! grep -q 'hero-logo-card' public/index.html
          test -f public/favicon.svg
          test -f public/impressum.html
          test -f public/datenschutz.html
          test -f public/legal.css
          test -f public/theme.js
          test -f public/logos/tennis-schiri.png
          test -f public/logos/tennis-schiri-on-light.png
          test -f public/logos/tennilo.png
          test -f public/logos/tennilo-score.png
          test -f public/logos/tennilo-score-dark-original.png
          test -f public/logos/wer-muss.webp
          test -s public/logos/mw-hauptlogo-hell.png
          test -s public/logos/mw-hauptlogo-dunkel.png
          test -s public/logos/mw-icon-hell.png
          test -s public/logos/mw-icon-dunkel.png

      - name: Nur Website-Dateien hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt}"
          : "${FTP_USER:?FTP_USER fehlt}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt}"
          # WICHTIG: FTP-Benutzer muss als Startverzeichnis /wiedeck-de/ haben.
          # Dadurch landen index.html und favicon.svg direkt im Domain-Verzeichnis.
          for file in public/favicon.svg public/theme.js public/legal.css public/impressum.html public/datenschutz.html public/logos/tennis-schiri.png public/logos/tennis-schiri-on-light.png public/logos/tennilo.png public/logos/tennilo-score.png public/logos/tennilo-score-dark-original.png public/logos/wer-muss.webp public/logos/mw-hauptlogo-hell.png public/logos/mw-hauptlogo-dunkel.png public/logos/mw-icon-hell.png public/logos/mw-icon-dunkel.png public/logos/mw-symbol-light.png public/logos/mw-symbol-dark.png public/logos/mw-favicon-light.png public/logos/mw-favicon-dark.png public/index.html; do
            remote="${file#public/}"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
          done
