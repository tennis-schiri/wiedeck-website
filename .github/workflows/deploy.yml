name: wiedeck.de manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'public/**'
      - 'assets/hrc-art/**'
      - 'scripts/build_hrc_pins.py'

permissions:
  contents: read

concurrency:
  group: wiedeck-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Landingpage per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dateien abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Freigestellte MW-Symbole erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mw-venv"
          "$RUNNER_TEMP/mw-venv/bin/pip" install --disable-pip-version-check --quiet Pillow
          "$RUNNER_TEMP/mw-venv/bin/python" scripts/build_mw_transparent.py

      - name: Prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -s branding/mw-monogram-original.png
          test -f scripts/build_mw_transparent.py
          test -s public/logos/mw-symbol-light.png
          test -s public/logos/mw-symbol-dark.png
          test -s public/logos/mw-favicon-light.png
          test -s public/logos/mw-favicon-dark.png
          grep -q 'id="mw-cutout-light"' public/index.html
          grep -q 'id="mw-cutout-dark"' public/index.html
          ! grep -q 'hero-logo-card' public/index.html
          grep -q 'aspect-ratio:745 / 366' public/index.html
          grep -Fq '.hero-mark img.logo-mode-dark{width:100%;filter:url("#mw-cutout-dark");clip-path:inset(10px 0 6px 0)}' public/index.html
          grep -Fq '.hero-mark img.logo-mode-dark{width:100%;filter:url("#mw-cutout-dark");clip-path:inset(10px 0 6px 0)}' public/en/index.html
          test -f public/favicon.svg
          test -f public/impressum.html
          test -f public/datenschutz.html
          test -f public/en/index.html
          test -f public/en/impressum.html
          test -f public/en/datenschutz.html
          test -s public/assets/home-projects.css
          test -s public/logos/tennilo-score-transparent.png
          grep -Fq 'Theme continuity / MW 2026' public/assets/home-projects.css
          grep -Fq 'var(--mw-social-bg)' public/assets/home-projects.css
          grep -Fq 'var(--mw-feature-bg)' public/assets/home-projects.css
          grep -Fq 'var(--mw-minis-feature-bg)' public/assets/home-projects.css
          grep -Fq 'Theme continuity: legal footer' public/legal.css
          test -s public/logos/mw-watermark-original.png
          grep -Fq 'logos/mw-watermark-original.png' public/index.html
          grep -Fq 'logos/mw-watermark-original.png' public/en/index.html
          grep -Fq 'html[data-theme="dark"] .social-watermark' public/assets/home-projects.css
          ! grep -Fq 'social-watermark logo-mode-light' public/index.html
          ! grep -Fq 'social-watermark logo-mode-dark' public/index.html
          grep -Fq 'width:min(22vw,255px)' public/assets/home-projects.css
          grep -Fq 'data-scroll-top' public/index.html
          grep -Fq 'data-scroll-top' public/en/index.html
          grep -Fq 'scrollToPageStart(false)' public/theme.js
          test -s public/media/score-demo-watch.png
          test -s public/media/score-demo-watch-cutout.svg
          test -s public/media/michael-wiedeck-persoenlich.jpg
          grep -q 'id="micha"' public/index.html
          grep -q 'id="micha"' public/en/index.html
          test "$(grep -o 'class="life-card life-card--' public/index.html | wc -l)" -eq 6
          test "$(grep -o 'class="life-card life-card--' public/en/index.html | wc -l)" -eq 6
          grep -q 'REISEN' public/index.html
          grep -q 'TRAVEL' public/en/index.html
          grep -q 'FAMILIE' public/index.html
          grep -q 'FAMILY' public/en/index.html
          grep -q 'id="unterwegs"' public/index.html
          grep -q 'id="unterwegs"' public/en/index.html
          test "$(grep -o '<article class="travel-card' public/index.html | wc -l)" -eq 27
          test "$(grep -o '<article class="travel-card' public/en/index.html | wc -l)" -eq 27
          # Five geographic sections: 7 repeat visits, then four rows of five.
          for page in public/index.html public/en/index.html; do
            test "$(grep -o 'class="travel-group-head"' "$page" | wc -l)" -eq 5
            test "$(grep -o '<article class="travel-card' "$page" | wc -l)" -eq 27
          done
          grep -Fq '<h5>NORDEN & NORDOSTEN</h5><span>05</span>' public/index.html
          grep -Fq '<h5>WESTEN & ATLANTIK</h5><span>05</span>' public/index.html
          grep -Fq '<h5>MITTELEUROPA & ALPEN</h5><span>05</span>' public/index.html
          grep -Fq '<h5>SÜDEN & MITTELMEER</h5><span>05</span>' public/index.html
          grep -Fq '<h5>NORTH & NORTHEAST</h5><span>05</span>' public/en/index.html
          grep -Fq '<h5>WEST & ATLANTIC</h5><span>05</span>' public/en/index.html
          grep -Fq '<h5>CENTRAL EUROPE & ALPS</h5><span>05</span>' public/en/index.html
          grep -Fq '<h5>SOUTH & MEDITERRANEAN</h5><span>05</span>' public/en/index.html
          test "$(grep -o 'travel-card--repeat' public/index.html | wc -l)" -eq 7
          test "$(grep -o 'travel-card--repeat' public/en/index.html | wc -l)" -eq 7
          grep -q 'Schottland' public/index.html
          grep -q 'Scotland' public/en/index.html
          grep -Fq 'travel-grid' public/assets/home-projects.css
          test "$(find public/media/flags -maxdepth 1 -name '*.svg' -type f | wc -l)" -eq 19
          test "$(grep -o 'class="travel-flag travel-flag-image"' public/index.html | wc -l)" -eq 27
          test "$(grep -o 'class="travel-flag travel-flag-image"' public/en/index.html | wc -l)" -eq 27
          test "$(grep -o 'class="travel-flag-slot"' public/index.html | wc -l)" -eq 27
          test "$(grep -o 'class="travel-flag-slot"' public/en/index.html | wc -l)" -eq 27
          ! grep -Fq 'class="travel-number"' public/index.html
          ! grep -Fq 'class="travel-number"' public/en/index.html
          test "$(grep -o 'class="travel-football-icon"' public/index.html | wc -l)" -eq 4
          test "$(grep -o 'class="travel-football-icon"' public/en/index.html | wc -l)" -eq 4
          test "$(find public/media/landmarks -maxdepth 1 -name '*.svg' -type f | wc -l)" -eq 29
          test "$(grep -o 'class="travel-landmark-icon"' public/index.html | wc -l)" -eq 27
          test "$(grep -o 'class="travel-landmark-icon"' public/en/index.html | wc -l)" -eq 27
          test "$(grep -o 'class="travel-landmark-label"' public/index.html | wc -l)" -eq 27
          test "$(grep -o 'class="travel-landmark-label"' public/en/index.html | wc -l)" -eq 27
          ! grep -Fq 'travel-skyline' public/index.html
          ! grep -Fq 'travel-skyline' public/en/index.html
          test -s public/media/tennis-ball.svg
          test -s public/media/ice-hockey.svg
          test -s public/media/football.svg
          test -s public/media/olympic-rings.svg
          test -s public/media/landmarks/cologne.svg
          test -s public/media/landmarks/paris.svg
          test -s public/media/flags/sct.svg
          test -s public/media/flags/gb.svg
          grep -Fq 'media/flags/' public/index.html
          grep -Fq 'media/flags/' public/en/index.html
          grep -Fq 'Eisbären' public/index.html
          grep -Fq 'class="brand" data-scroll-top' public/index.html
          grep -Fq 'class="brand" data-scroll-top' public/en/index.html
          grep -Fq 'id="comedy-locations"' public/index.html
          grep -Fq 'id="comedy-locations"' public/en/index.html
          grep -Fq 'Quatsch Comedy Club' public/index.html
          grep -Fq 'Atelier Theater Köln' public/index.html
          grep -Fq '<span class="travel-landmark-label">Manneken Pis</span>' public/index.html
          grep -Fq '<span class="travel-landmark-label">Manneken Pis</span>' public/en/index.html
          grep -Fq '<span class="travel-landmark-label">Hagia Sophia</span>' public/index.html
          grep -Fq '<span class="travel-landmark-label">Hagia Sophia</span>' public/en/index.html
          grep -Fq '<span class="travel-landmark-label">Goldenes Dachl</span>' public/index.html
          grep -Fq '<span class="travel-landmark-label">Golden Roof</span>' public/en/index.html
          grep -Fq '<span class="travel-landmark-label">Bozner Dom</span>' public/index.html
          grep -Fq '<span class="travel-landmark-label">Bolzano Cathedral</span>' public/en/index.html
          grep -Fq 'media/landmarks/istanbul.svg?v=20261118-unified-ink' public/index.html
          grep -Fq 'media/landmarks/innsbruck.svg?v=20261118-unified-ink' public/en/index.html
          grep -Fq 'media/landmarks/bolzano.svg?v=20261118-unified-ink' public/index.html
          grep -Fq 'media/landmarks/albena.svg?v=20261118-unified-ink' public/en/index.html
          ! grep -Eq 'fill="#[0-9A-Fa-f]{6}"' public/media/landmarks/{istanbul,innsbruck,bolzano,albena}.svg
          grep -Fq 'Atelier Theater Köln' public/en/index.html
          grep -Fq 'KERB Foodhall / Pink Room' public/index.html
          grep -Fq 'KERB Foodhall / Pink Room' public/en/index.html
          grep -Fq 'creativecommons.org/licenses/by/4.0/' public/index.html
          grep -Fq 'creativecommons.org/licenses/by/4.0/' public/en/index.html
          grep -Fq 'Mad Monkey Room' public/en/index.html
          ! grep -Fq 'Bar92 = 15' public/index.html
          grep -Fq 'Eisbären' public/en/index.html
          grep -Fq 'id="hobbys"' public/index.html
          grep -Fq 'id="hobbys"' public/en/index.html
          grep -Fq 'id="genuss"' public/index.html
          grep -Fq 'id="genuss"' public/en/index.html
          test -s public/assets/hrc-collector.css
          grep -Fq '.hrc-collection .hrc-flag-ribbon' public/assets/hrc-collector.css
          grep -Fq 'html[data-theme="light"] .hrc-collection' public/assets/hrc-collector.css
          # The stylesheet version changes with each design update; validate the link, not a stale cache key.
          grep -Eq 'href="assets/hrc-collector\.css\?v=[^"]+"' public/index.html
          grep -Eq 'href="\.\./assets/hrc-collector\.css\?v=[^"]+"|href="assets/hrc-collector\.css\?v=[^"]+"' public/en/index.html
          # 23 original portrait-style HRC tickets; no pin image generation required.
          grep -Fq 'HRC18' public/assets/hrc-collector.css
          grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' public/assets/hrc-collector.css
          for page in public/index.html public/en/index.html; do
            test "$(grep -o 'class="hrc-stop' "$page" | wc -l)" -eq 23
            test "$(grep -o 'class="hrc-flag-ribbon"' "$page" | wc -l)" -eq 23
            ! grep -Fq 'hrc-enamel-pin' "$page"
            ! grep -Fq 'hrc-pin-image' "$page"
            test "$(grep -o 'class="hrc-stop"' "$page" | wc -l)" -eq 23
            test "$(grep -o 'hrc-status--closed' "$page" | wc -l)" -eq 3
            test "$(grep -o 'hrc-status--former' "$page" | wc -l)" -eq 1
            test "$(grep -o 'class="hrc-flag-image"' "$page" | wc -l)" -eq 23
            test "$(grep -o 'class="hrc-vinyl"' "$page" | wc -l)" -eq 23
            grep -Fq 'MY HARD ROCK CAFÉ COLLECTION' "$page"
            grep -Fq '23 STOPS COLLECTED ON THE ROAD' "$page"
            grep -Fq 'LONDON <small>ORIGINAL</small>' "$page"
            grep -Fq 'LONDON <small>PICCADILLY</small>' "$page"
            ! grep -Fq 'hrc-venue-' "$page"
            ! grep -Fq 'hrc-pin-plate' "$page"
            ! grep -Fq 'hrc-pagination' "$page"
            ! grep -Fq 'hrc-pager' "$page"
          done
          ! grep -q 'id="story-title"' public/index.html
          grep -Fq 'personal-grid' public/assets/home-projects.css
          grep -Fq 'html[data-theme="dark"]{' public/assets/home-projects.css
          grep -q 'watch-silhouette' public/media/score-demo-watch-cutout.svg
          test -s public/media/score-demo-phone.png
          test -s public/media/score-demo-scoreboard.png
          grep -q 'id="aktuell"' public/index.html
          grep -q 'id="now"' public/en/index.html
          grep -q 'id="einblicke"' public/index.html
          grep -q 'id="glimpses"' public/en/index.html
          ! grep -Fq 'score.tennilo.de' public/index.html
          ! grep -Fq 'score.tennilo.de' public/en/index.html
          grep -q 'class="manifesto-logo-light logo-mode-light"' public/index.html
          grep -q 'class="manifesto-logo-dark logo-mode-dark"' public/index.html
          grep -q 'class="manifesto-logo-light logo-mode-light"' public/en/index.html
          grep -q 'class="manifesto-logo-dark logo-mode-dark"' public/en/index.html
          grep -Fq 'html[data-theme="dark"] .manifesto' public/assets/home-projects.css
          grep -q 'class="manifesto-logo-viewport"' public/index.html
          grep -q 'class="manifesto-logo-viewport"' public/en/index.html
          test -s public/logos/tennilo-tournament-transparent.png
          test -s public/logos/mini-apps/wm04b-logo.svg
          test -s public/logos/mini-apps/pl05-icon.webp
          test -s public/logos/mini-apps/fc05-icon.webp
          test -s public/logos/mini-apps/nk05-icon.webp
          test -s public/logos/mini-apps/ne05-icon.webp
          test -s public/logos/mini-apps/vd05-icon.webp
          grep -q 'id="mini-apps"' public/index.html
          grep -q 'id="mini-apps"' public/en/index.html
          ! grep -Fq 'score.tennilo.de' public/index.html
          ! grep -Fq 'score.tennilo.de' public/en/index.html
          test -f public/legal.css
          test -f public/theme.js
          test -f public/logos/tennis-schiri.png
          test -f public/logos/tennis-schiri-on-light.png
          test -f public/logos/tennilo.png
          test -s public/logos/tennilo-tournament.png
          test -f public/logos/tennilo-score.png
          test -f public/logos/tennilo-score-dark-original.png
          test -s public/logos/tennilo-umpire.png
          test -f public/logos/wer-muss.webp
          test -s public/logos/mw-hauptlogo-hell.png
          test -s public/logos/mw-hauptlogo-dunkel.png
          test -s public/logos/mw-icon-hell.png
          test -s public/logos/mw-icon-dunkel.png

      - name: Nur Website-Dateien hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt}"
          : "${FTP_USER:?FTP_USER fehlt}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt}"
          # WICHTIG: FTP-Benutzer muss als Startverzeichnis /wiedeck-de/ haben.
          # Dadurch landen index.html und favicon.svg direkt im Domain-Verzeichnis.
          # Einzelne FTPS-Verbindungen können vorübergehend blockiert sein.
          # curl versucht bei Netzwerk- und Timeoutfehlern kontrolliert erneut.
          for file in public/favicon.svg public/theme.js public/legal.css public/impressum.html public/datenschutz.html public/en/index.html public/en/impressum.html public/en/datenschutz.html public/logos/tennis-schiri.png public/logos/tennis-schiri-on-light.png public/logos/tennilo.png public/logos/tennilo-tournament.png public/logos/tennilo-tournament-transparent.png public/assets/home-projects.css public/assets/hrc-collector.css public/media/score-demo-watch.png public/media/score-demo-watch-cutout.svg public/media/flags/*.svg public/media/landmarks/*.svg public/media/tennis-ball.svg public/media/ice-hockey.svg public/media/football.svg public/media/olympic-rings.svg public/media/michael-wiedeck-persoenlich.jpg public/media/score-demo-phone.png public/media/score-demo-scoreboard.png public/logos/tennilo-score.png public/logos/tennilo-score-transparent.png public/logos/tennilo-score-dark-original.png public/logos/tennilo-umpire.png public/logos/wer-muss.webp public/logos/mini-apps/wm04b-logo.svg public/logos/mini-apps/pl05-icon.webp public/logos/mini-apps/fc05-icon.webp public/logos/mini-apps/nk05-icon.webp public/logos/mini-apps/ne05-icon.webp public/logos/mini-apps/vd05-icon.webp public/logos/mw-hauptlogo-hell.png public/logos/mw-hauptlogo-dunkel.png public/logos/mw-icon-hell.png public/logos/mw-icon-dunkel.png public/logos/mw-symbol-light.png public/logos/mw-symbol-dark.png public/logos/mw-watermark-original.png public/logos/mw-favicon-light.png public/logos/mw-favicon-dark.png public/index.html; do
            remote="${file#public/}"
            printf 'FTPS: %s\n' "$remote"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --connect-timeout 20 --max-time 120 \
              --retry 4 --retry-delay 10 --retry-all-errors \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
          done
