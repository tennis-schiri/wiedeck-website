name: wiedeck.de manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: wiedeck-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Landingpage per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dateien abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/favicon.svg
          test -f public/impressum.html
          test -f public/datenschutz.html
          test -f public/legal.css

      - name: Nur Website-Dateien hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt}"
          : "${FTP_USER:?FTP_USER fehlt}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt}"
          # WICHTIG: FTP-Benutzer muss als Startverzeichnis /wiedeck-de/ haben.
          # Dadurch landen index.html und favicon.svg direkt im Domain-Verzeichnis.
          for file in public/favicon.svg public/legal.css public/impressum.html public/datenschutz.html public/index.html; do
            remote="${file#public/}"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
          done
